# Gold rows: expected `out` values per fixture agent. Drafted by the DA; not gold until the owner
# adjudicates (adjudicated_by set). gold_agreement() compares only the keys under `out`;
# `context` holds extra upstream fields fed to the next link and is never scored.
skill: signal-card
rows:
- agent: review-bot
  drafted_by: DA
  adjudicated_by: principal
  note: share of comments authors resolve rather than dismiss. Resolved/dismissed is recorded per
    comment, so the type is score (was preference; changed and re-adjudicated 2026-11-18).
  out:
    slots:
      signal: score
      artifact: skill file
  context:
    chosenSignal: share of review comments resolved rather than dismissed
    slots:
      signal: score
      search: person reviewing proposals
      artifact: skill file
- agent: home-assistant
  drafted_by: DA
  adjudicated_by: principal
  note: corrections in chat; rate of requests needing no correction. Each request records corrected or not, so the raw form is a score (was feedback; changed and re-adjudicated 2026-11-19).
  out:
    slots:
      signal: score
      artifact: memory
  context:
    chosenSignal: share of requests that need no correction
    slots:
      signal: score
      search: person reviewing proposals
      artifact: memory
- agent: support-triage
  drafted_by: DA
  adjudicated_by: principal
  note: share of tickets not moved to another queue.
  out:
    slots:
      signal: score
      artifact: instructions
  context:
    chosenSignal: share of tickets not moved to another queue
    slots:
      signal: score
      search: hill-climbing
      artifact: instructions
- agent: intent-classifier
  drafted_by: DA
  adjudicated_by: principal
  note: exact-match accuracy on held-out messages.
  out:
    slots:
      signal: score
      artifact: demos
  context:
    chosenSignal: exact-match accuracy on held-out messages
    slots:
      signal: score
      search: bootstrap demos
      artifact: demos
- agent: sales-gpt
  drafted_by: DA
  adjudicated_by: principal
  note: similarity of draft to the sent version; reply rate is a slow proxy.
  out:
    slots:
      signal: score
      artifact: instructions
  context:
    chosenSignal: token overlap between draft and sent email
    slots:
      signal: score
      search: person reviewing proposals
      artifact: instructions
